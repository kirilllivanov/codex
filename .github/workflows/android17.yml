name: Codex 0.166.0 / Android 17 / Arm C1-Pro

# Only run the dedicated Android ARM64 cross-build on the experiment branch.
# A pull request would also trigger unrelated repository-wide CI matrices.
on:
  push:
    branches:
      - ci/android17-v0.166.0-c1-pro
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android17-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-arm64:
    name: Codex CLI 0.166.0 / Android 17 / C1-Pro
    # Dedicated release-based Android branch runs only this Ubuntu job.
    # Do not run the macOS, Windows, Bazel, or V8 PR matrices for build debugging.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: codex-rs
    env:
      ANDROID_API: '37'
      NDK_VERSION: '30.0.16248370'
      TARGET: aarch64-linux-android
      # Rust 1.99.1 supports Android std::fs::File locking.
      # Upstream rust-toolchain.toml remains unchanged on other platforms.
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
      # Android prebuilts are not provided by the pinned rusty_v8 dependency.
      V8_FROM_SOURCE: '1'
      LIBLZMA_NO_PKG_CONFIG: '1'
      OPENSSL_NO_PKG_CONFIG: '1'
      CODEX_SKIP_VENDORED_BWRAP: '1'

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang cmake ninja-build pkg-config libclang-dev protobuf-compiler

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''

      - name: Install Android 17 SDK and NDK r30
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-${ANDROID_API}.0" "ndk;${NDK_VERSION}"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          ndk="${sdk_root}/ndk/${NDK_VERSION}"
          llvm="${ndk}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "${llvm}/aarch64-linux-android${ANDROID_API}-clang"
          test -x "${llvm}/aarch64-linux-android${ANDROID_API}-clang++"
          test -s "${ndk}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_static.a"
          echo "ANDROID_NDK_HOME=${ndk}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ndk}" >> "${GITHUB_ENV}"
          echo "CLANG_BASE_PATH=${ndk}/toolchains/llvm/prebuilt/linux-x86_64" >> "${GITHUB_ENV}"
          echo "CC_aarch64_linux_android=${llvm}/aarch64-linux-android${ANDROID_API}-clang" >> "${GITHUB_ENV}"
          echo "CXX_aarch64_linux_android=${llvm}/aarch64-linux-android${ANDROID_API}-clang++" >> "${GITHUB_ENV}"
          echo "AR_aarch64_linux_android=${llvm}/llvm-ar" >> "${GITHUB_ENV}"
          # NDK r30 Clang 21 does not support -mcpu=c1-pro.
          # Use HWCAP-compatible Armv9.2-A+BF16+SME2, tuned for Cortex-A720.
          echo "CFLAGS_aarch64_linux_android=-O3 -march=armv9.2-a+bf16+sme2 -mtune=cortex-a720" >> "${GITHUB_ENV}"
          echo "CXXFLAGS_aarch64_linux_android=-O3 -march=armv9.2-a+bf16+sme2 -mtune=cortex-a720" >> "${GITHUB_ENV}"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${llvm}/aarch64-linux-android${ANDROID_API}-clang++" >> "${GITHUB_ENV}"
          builtins="$(find "${ndk}/toolchains/llvm/prebuilt/linux-x86_64" -name libclang_rt.builtins-aarch64-android.a -print -quit)"
          test -n "${builtins}"
          echo 'CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS=-Ctarget-cpu=c1-pro -Ctarget-feature=-mops,-lse128 -Clink-arg=-static-libstdc++ -Clink-arg=-lc++_static -Clink-arg=-Wl,-z,max-page-size=16384 -Clink-arg='"${builtins}" >> "${GITHUB_ENV}"
          echo "${llvm}" >> "${GITHUB_PATH}"
          "${llvm}/clang" --version | head -n 1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # latest stable action, pinned
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android

      - name: Verify Rust C1-Pro, NDK Clang ISA flags and device HWCAP
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          test "$(rustc --version | awk '{print $2}')" = '1.99.1'
          rustc --print target-libdir --target "${TARGET}" | xargs test -d
          rustc --print target-cpus --target "${TARGET}" | awk '$1=="c1-pro" {found=1} END {exit !found}'
          printf 'int c1pro_probe(int x) { return x + 1; }\n' |
            "${CC_aarch64_linux_android}" -O3 -march=armv9.2-a+bf16+sme2 -mtune=cortex-a720 -x c -c - -o "${RUNNER_TEMP}/c1pro-probe.o"
          test -s "${RUNNER_TEMP}/c1pro-probe.o"
          # The exact auxv bitmasks supplied by the Android device.
          python3 - <<'PY'
          hwcap = 0x00000000ffffffff
          hwcap2 = 0x000051a8bc9af3ff
          required = [
              ("AES", hwcap, 3), ("ASIMD dotprod", hwcap, 20),
              ("SVE", hwcap, 22), ("SVE2", hwcap2, 1),
              ("BF16", hwcap2, 14), ("SME", hwcap2, 23),
              ("SME2", hwcap2, 37), ("LRCPC3", hwcap2, 46),
          ]
          for name, mask, bit in required:
              if not mask & (1 << bit):
                  raise SystemExit(f"Missing device HWCAP extension: {name}")
              print(f"Device HWCAP: {name} present")
          for name, bit in [("MOPS", 43), ("LSE128", 47)]:
              if hwcap2 & (1 << bit):
                  raise SystemExit(f"Unexpected HWCAP2 {name}")
              print(f"Device HWCAP2: {name} not advertised (do not force-enable)")
          PY

      - name: Build OpenSSL 3.5.9 for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          openssl_src="${RUNNER_TEMP}/openssl-src"
          openssl_install="${RUNNER_TEMP}/openssl-android"
          mkdir -p "${openssl_src}"
          # Pin OpenSSL 3.5.9 to its exact upstream release commit.
          curl --fail --location --retry 3 \
            "https://codeload.github.com/openssl/openssl/tar.gz/45e844fa2a14ec92d146bd8f5778ac130b6625fb" \
            -o "${RUNNER_TEMP}/openssl.tar.gz"
          tar -xzf "${RUNNER_TEMP}/openssl.tar.gz" --strip-components=1 -C "${openssl_src}"
          cd "${openssl_src}"
          ./Configure android-arm64 "-D__ANDROID_API__=${ANDROID_API}" \
            "-march=armv9.2-a+bf16+sme2" "-mtune=cortex-a720" "-O3" "-Wl,-z,max-page-size=16384" \
            no-shared no-tests no-module \
            --prefix="${openssl_install}" --openssldir="${openssl_install}/ssl"
          make -j 2
          make install_sw
          test -s "${openssl_install}/lib64/libssl.a" || test -s "${openssl_install}/lib/libssl.a"
          echo "OPENSSL_DIR=${openssl_install}" >> "${GITHUB_ENV}"
          echo "OPENSSL_STATIC=1" >> "${GITHUB_ENV}"

      - name: Cross-compile Codex CLI
        shell: bash
        run: |
          set -euo pipefail
          # Keep upstream Cargo.lock, but allow CI-only reconciliation for Android.
          # Keep upstream Cargo.lock in Git; allow Cargo to refresh its runner copy.
          cargo build --release --target "${TARGET}" \
            -p codex-cli --bin codex -j 2

      - name: Check Android ELF and package binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/codex"
          test -s "${bin}"
          file "${bin}"
          "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h "${bin}" | grep -E 'Class:|Machine:'
          "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -l "${bin}" | grep -A1 LOAD
          # libc++ must be statically linked: the final ELF must not request its shared DSO.
          needed="$("${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d "${bin}" | grep '(NEEDED)' || true)"
          printf '%s\n' "${needed}"
          if grep -q 'libc++_shared.so' <<< "${needed}"; then
            echo 'ERROR: binary still depends on libc++_shared.so' >&2
            exit 1
          fi
          mkdir -p dist
          cp "${bin}" dist/codex
          (cd dist && sha256sum codex > SHA256SUMS)
          tar -czf dist/codex-android17-aarch64-c1-pro.tar.gz -C dist codex SHA256SUMS

      - name: Upload Android CLI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-android17-aarch64-c1-pro-rust199-static-cxx
          path: codex-rs/dist/codex-android17-aarch64-c1-pro.tar.gz
          if-no-files-found: error
          retention-days: 14
